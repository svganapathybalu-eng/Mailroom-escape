<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Escape the Inbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: scoreboard of ID badges on top, case file left, four team desks right. Built for a projector. */
:root{
  --bg:#E6EBE7;--surface:#F4F7F3;--surface-2:#FFFFFF;--ink:#16221D;--muted:#55665D;--line:#C4CFC8;
  --lanyard:#F2C230;--on-lanyard:#16221D;
  --t1:#D6402B;--t2:#2D5BE3;--t3:#E0A100;--t4:#A8327F;
  --on-t1:#FFFFFF;--on-t2:#FFFFFF;--on-t3:#16221D;--on-t4:#FFFFFF;
  --danger:#B3261E;--hl:rgba(242,194,48,.5);--scrim:rgba(10,16,13,.6);
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1512;--surface:#16211C;--surface-2:#1B2822;--ink:#E9F0EB;--muted:#9BAEA3;--line:#2D3F37;
  --t1:#FF6B52;--t2:#7C9BFF;--t3:#F2B93B;--t4:#E07BBA;
  --on-t1:#1A0B08;--on-t2:#0B1330;--on-t3:#241A00;--on-t4:#2A0B1D;
  --danger:#FF8A80;--hl:rgba(242,194,48,.3);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1512;--surface:#16211C;--surface-2:#1B2822;--ink:#E9F0EB;--muted:#9BAEA3;--line:#2D3F37;
  --t1:#FF6B52;--t2:#7C9BFF;--t3:#F2B93B;--t4:#E07BBA;
  --on-t1:#1A0B08;--on-t2:#0B1330;--on-t3:#241A00;--on-t4:#2A0B1D;
  --danger:#FF8A80;--hl:rgba(242,194,48,.3);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-inline:clamp(16px,3vw,40px);padding-block:18px 56px}
h1,h2,h3,p,ol,ul,dl,dd{margin:0}
ol,ul{padding-left:1.2rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lanyard);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tm1{--tc:var(--t1);--on-tc:var(--on-t1)}.tm2{--tc:var(--t2);--on-tc:var(--on-t2)}
.tm3{--tc:var(--t3);--on-tc:var(--on-t3)}.tm4{--tc:var(--t4);--on-tc:var(--on-t4)}
/* top bar */
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.25rem;letter-spacing:-.01em}
.mark{width:18px;height:26px;border:2.5px solid var(--ink);border-radius:99px 99px 3px 3px}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:2px solid var(--ink);background:transparent;border-radius:9px;padding:.5rem .9rem;font-weight:600;cursor:pointer;line-height:1.2}
.btn:hover{background:var(--surface-2)}
.btn.on{background:var(--ink);color:var(--bg)}
.btn.primary{background:var(--lanyard);color:var(--on-lanyard);box-shadow:0 3px 0 var(--ink)}
.btn.primary:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.big{font-size:1.1rem;padding:.7rem 1.2rem}
.btn.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.mini{border:1.5px solid var(--ink);background:var(--surface-2);border-radius:6px;padding:.1rem .45rem;font-weight:600;cursor:pointer;font-size:.8rem}
.eyebrow{font-family:var(--mono);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chip{display:inline-block;font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;padding:.15rem .5rem;border-radius:99px;border:1.5px solid var(--ink);white-space:nowrap}
.chip.open{background:var(--tc);color:var(--on-tc)}
.chip.frozen{background:var(--ink);color:var(--bg)}
.chip.tiny{background:var(--lanyard);color:var(--on-lanyard)}
/* doors */
.door{position:relative;width:56px;height:76px;border:2.5px solid var(--ink);border-radius:99px 99px 4px 4px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.7rem;background:var(--surface-2)}
.door::after{content:"";position:absolute;right:9px;top:55%;width:6px;height:6px;border-radius:50%;background:var(--ink)}
.door.sm{width:32px;height:44px;font-size:1rem;border-width:2px}
.door.sm::after{right:5px;width:4px;height:4px}
.door.cur{background:var(--lanyard);color:var(--on-lanyard)}
.door.past{opacity:.45}
.doors{display:flex;gap:8px;margin-top:10px}
/* setup */
.hero{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:32px;align-items:start;margin-bottom:36px}
h1.title{font-family:var(--display);font-weight:800;font-size:clamp(3rem,9vw,7rem);line-height:.9;letter-spacing:-.035em;text-wrap:balance;margin:10px 0 16px}
.lede{font-size:1.2rem;max-width:34rem;color:var(--muted)}
.doorrow{display:flex;flex-wrap:wrap;gap:16px;margin-top:26px}
.dcap{display:flex;flex-direction:column;align-items:center;gap:6px;width:92px;text-align:center;font-size:.78rem;line-height:1.2}
.setup{background:var(--surface-2);border:2px solid var(--ink);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px}
.setup h2,.rules h3,.panel h3{font-family:var(--display);font-weight:800;letter-spacing:-.01em}
.field{display:flex;align-items:center;gap:10px}
.field input,.field select{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:.55rem .7rem}
.dot{flex:none;width:16px;height:16px;border-radius:50%;background:var(--tc)}
.resume{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--lanyard);color:var(--on-lanyard);border:2px solid var(--ink);border-radius:12px;padding:12px 16px;margin-bottom:22px}
.resume .btn{border-color:var(--on-lanyard);color:var(--on-lanyard)}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.rule{background:var(--surface-2);border:1.5px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px}
.rule ul,.rule ol{display:flex;flex-direction:column;gap:6px}
.sec-title{font-family:var(--display);font-weight:800;font-size:1.6rem;letter-spacing:-.02em;margin-bottom:14px}
/* scoreboard */
.score{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.badge{position:relative;background:var(--surface-2);border:2px solid var(--ink);border-radius:14px;padding:22px 14px 12px;min-width:0;display:flex;flex-direction:column;gap:8px}
.badge::before{content:"";position:absolute;top:7px;left:50%;width:36px;height:8px;border-radius:99px;background:var(--bg);border:2px solid var(--ink);transform:translateX(-50%)}
.b-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.avatar{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--tc);color:var(--on-tc);font-family:var(--display);font-weight:800}
.b-name{font-weight:600;line-height:1.15;overflow-wrap:anywhere;min-width:0}
.b-mid{display:flex;align-items:center;justify-content:space-between;gap:8px}
.b-score{font-family:var(--display);font-weight:800;font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
.b-score.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.2)}}
.adj{display:flex;gap:4px}
.letters{display:flex;gap:5px}
.letter{width:1.8rem;height:2.2rem;border-radius:99px 99px 3px 3px;border:2px dashed var(--muted);display:grid;place-items:center;font-family:var(--display);font-weight:800;color:transparent}
.letter.on{background:var(--tc);color:var(--on-tc);border:2px solid var(--ink)}
/* room head */
.roomhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end;margin-bottom:18px}
h2.rname{font-family:var(--display);font-weight:800;font-size:clamp(2rem,4.5vw,3.4rem);line-height:1;letter-spacing:-.025em;text-wrap:balance;margin-top:4px}
.clock{display:flex;flex-direction:column;gap:8px;min-width:min(100%,300px)}
.timer{font-family:var(--mono);font-weight:600;font-size:clamp(2.6rem,6vw,4.2rem);line-height:1;font-variant-numeric:tabular-nums}
.timer.low{color:var(--danger)}
.tbar{height:6px;background:var(--line);border-radius:9px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--ink);transition:width .3s linear}
.ctl{display:flex;flex-wrap:wrap;gap:8px}
/* board */
.board{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:20px;align-items:start}
.case{display:flex;flex-direction:column;gap:14px;min-width:0}
.teams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.panel{background:var(--surface-2);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.scenario{font-size:1.05rem}
.paper{position:relative;background:var(--surface-2);border:2px solid var(--ink);border-radius:12px;overflow:hidden}
.stamp{position:absolute;right:14px;top:12px;transform:rotate(4deg);border:2px solid var(--danger);color:var(--danger);font-family:var(--mono);font-weight:600;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;padding:.1rem .45rem;border-radius:4px;opacity:.85}
.mail-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:14px 16px;padding-right:130px;border-bottom:1.5px solid var(--line);font-size:.95rem}
.mail-head dt{font-family:var(--mono);color:var(--muted);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;padding-top:.2rem}
.mail-head dd{overflow-wrap:anywhere}
.mail-body{padding:16px;white-space:pre-wrap;line-height:1.7;font-size:1.08rem;overflow-wrap:anywhere}
.reveal .flaw{background:var(--hl);text-decoration:underline wavy var(--danger);text-underline-offset:3px}
.reveal .flaw::after{content:attr(data-n);font-family:var(--mono);font-size:.65em;font-weight:600;vertical-align:super;color:var(--danger);margin-left:2px}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:.95rem}
.facts dt{font-family:var(--mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:.2rem}
.lock{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px}
.lock li{display:flex;gap:10px;align-items:baseline}
.lock b{flex:none;min-width:5.2rem;font-family:var(--mono);font-size:.78rem;letter-spacing:.04em;text-transform:uppercase}
.row{display:flex;flex-wrap:wrap;gap:8px}
.flaws{display:flex;flex-direction:column;gap:6px;font-size:.95rem}
.model{white-space:pre-wrap;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;font-size:.98rem}
.log{list-style:none;padding:0;display:flex;flex-direction:column;gap:5px;font-size:.92rem}
.muted{color:var(--muted)}
/* desks */
.desk{background:var(--surface-2);border:2px solid var(--ink);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.desk.unlocked{box-shadow:inset 0 0 0 4px var(--tc)}
.d-head{display:flex;gap:8px;align-items:center;justify-content:space-between;min-height:1.8rem}
.d-name{display:flex;gap:8px;align-items:center;font-weight:600;min-width:0;overflow-wrap:anywhere}
textarea.draft{width:100%;min-height:11rem;resize:vertical;font-size:1rem;line-height:1.5;padding:.7rem;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
textarea.draft:focus-visible{outline:3px solid var(--tc)}
textarea.draft[readonly]{opacity:.7}
.pins{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pin{border:1.5px solid var(--muted);border-radius:8px;padding:.4rem .2rem;text-align:center;font-size:.72rem;font-weight:600;line-height:1.15;background:transparent;color:var(--muted);cursor:default;overflow-wrap:anywhere}
.pin.on{background:var(--tc);color:var(--on-tc);border-color:var(--ink)}
.judge .pin:not([disabled]){border-style:dashed;cursor:pointer;color:var(--ink)}
.judge .pin.on{color:var(--on-tc)}
.d-foot{display:flex;flex-direction:column;gap:8px}
.d-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.cards{display:flex;flex-wrap:wrap;gap:6px}
.cardbtn{border:1.5px solid var(--ink);background:transparent;border-radius:99px;padding:.2rem .6rem;font-size:.74rem;font-weight:600;cursor:pointer}
.cardbtn:hover:not([disabled]){background:var(--lanyard);color:var(--on-lanyard)}
.cardbtn[disabled]{opacity:.35;cursor:not-allowed;text-decoration:line-through}
/* final */
.podium{list-style:none;padding:0;display:flex;flex-direction:column;gap:12px;margin-block:18px 26px}
.pod{display:grid;grid-template-columns:2.4rem minmax(0,1fr) auto;gap:6px 14px;align-items:center;background:var(--surface-2);border:2px solid var(--ink);border-radius:14px;padding:12px 16px}
.pod .rk{font-family:var(--display);font-weight:800;font-size:2rem;text-align:center}
.pod .nm{display:flex;gap:10px;align-items:center;font-weight:600;overflow-wrap:anywhere}
.pod .bar{grid-column:2;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.pod .bar i{display:block;height:100%;background:var(--tc)}
.pod .pt{font-family:var(--display);font-weight:800;font-size:2rem;font-variant-numeric:tabular-nums;grid-row:1}
.pod .ls{grid-column:3;grid-row:2;justify-self:end}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;margin-bottom:24px}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:.45rem .6rem;border-bottom:1.5px solid var(--line);text-align:left;white-space:nowrap}
th{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.joinbar{margin-bottom:18px}
.jb{display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:flex-start}
.jbtext{flex:1;min-width:min(100%,320px);display:flex;flex-direction:column;gap:8px}
.joininput{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:.5rem .7rem;font-family:var(--mono);font-size:.8rem}
.qr{background:#fff;padding:8px;border-radius:8px;line-height:0;max-width:100%}
.qr img,.qr canvas{max-width:100%;height:auto}
details summary{cursor:pointer;font-weight:600}
code{font-family:var(--mono);font-size:.9em}
body.team .desk:not(.mine){display:none}
body.team .teams{grid-template-columns:minmax(0,1fr)}
/* overlays */
.overlay{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;padding:16px;z-index:50}
.sheet{background:var(--bg);border:2px solid var(--ink);border-radius:14px;width:min(900px,100%);max-height:calc(100% - 8px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.sheet-head{display:flex;gap:12px;justify-content:space-between;align-items:center}
.sheet-head h2{font-family:var(--display);font-weight:800;font-size:1.6rem}
.targets{display:flex;flex-wrap:wrap;gap:8px}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:99px;font-weight:600;max-width:calc(100% - 32px);text-align:center;z-index:70}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
@media (max-width:1180px){.board{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){.hero{grid-template-columns:minmax(0,1fr)}.score{grid-template-columns:repeat(2,minmax(0,1fr))}.roomhead{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.teams{grid-template-columns:minmax(0,1fr)}.mail-head{padding-right:16px}.stamp{position:static;transform:none;align-self:flex-start;margin:12px 16px 0}.paper{display:flex;flex-direction:column}}
@media (prefers-reduced-motion:reduce){.b-score.bump{animation:none}.tbar i{transition:none}}
</style>
<header class="top" id="top"></header>
<main id="main"></main>

<div class="overlay" id="picker" hidden><div class="sheet" role="dialog" aria-modal="true" id="picker-body"></div></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<canvas id="confetti" hidden aria-hidden="true"></canvas>

function updateScore(){

function updateDoors(){

function renderCtl(){

  else if(p==='running'||p==='paused')h=`<button class="btn" data-act="${p==='running'?'room-pause':'room-resume'}">${p==='running'?'Pause':'Resume'}</button><button class="btn" data-act="room-add30">+30 s</button><button class="btn${armed.end?' danger':''}" data-act="room-end">${armed.end?'Sure? End round':'End round'}</button>`;
  else h=`<span class="chip">Round over</span>`;

}
function frozenLeft(i){return Math.max(0,Math.ceil((state.frozen[i]-Date.now())/1000));}
function deskStatus(i){

  if(R.order[i]!=null)return `<span class="chip open">Door open · #${R.order[i]}</span>`;
  if(frozenLeft(i)>0)return `<span class="chip frozen" data-fz="${i}">Out of office · ${frozenLeft(i)}s</span>`;
  const p=state.rphase;

function updateDesks(){

/* ---------- game actions ---------- */
function twice(key){
  const now=Date.now();
  if(armed[key]&&now-armed[key]<3000){delete armed[key];return true;}
  armed[key]=now;refreshArmed();
  setTimeout(()=>{if(armed[key]===now){delete armed[key];refreshArmed();}},3000);
  return false;
}
function refreshArmed(){if(state&&state.phase==='room'){renderCtl();}renderHeader();}
async function startGame(){
  const names=[0,1,2,3].map(i=>($('#tn'+i).value||'').trim()||DEFAULT_NAMES[i]);
  const secs=parseInt($('#secs').value,10)||240;
  let live=null;
  if($('#live')&&$('#live').checked){
    const repo=($('#repo').value||'').trim(),tok=($('#tok').value||'').trim();
    if(!/^[\w.-]+\/[\w.-]+$/.test(repo)||!tok){toast('Enter the repository as owner/name and paste the token.');return;}
    if(location.protocol==='file:'){toast('Open this page from your GitHub Pages address so teams can join.');return;}
    toast('Creating the room…');
    try{live=await createRoom(repo,tok);}catch(err){toast('Could not create the room: '+err.message);return;}
  }
  state=newState(names,secs);state.live=live;lastScores=[0,0,0,0];pendingResume=null;
  save();buildRoom();window.scrollTo(0,0);
  if(live)startHostSync();
}
function roomStart(){
  state.rphase='running';state.deadline=Date.now()+state.remaining*1000;
  addLog('Door '+ROOMS[state.room].id+' is open. Timer started.');beep(SND.start);updateAll();save();
}
function roomPause(){state.remaining=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));state.rphase='paused';updateAll();save();}
function roomResume(){state.rphase='running';state.deadline=Date.now()+state.remaining*1000;updateAll();save();}
function roomAdd30(){
  state.remaining+=30;state.total+=30;
  if(state.rphase==='running')state.deadline+=30000;
  updateTimer();save();
}
function endRound(reason){
  if(state.rphase==='ended')return;
  state.rphase='ended';if(reason==='time')state.remaining=0;
  state.frozen=[0,0,0,0];
  addLog(reason==='time'?'Time is up. The locks are closed.':reason==='all'?'Every team opened the door.':'The host ended the round.');
  if(reason!=='all')beep(SND.end);
  updateAll();save();
}
function roomNext(){
  state.room++;state.rphase='ready';state.remaining=state.secs;state.total=state.secs;state.frozen=[0,0,0,0];
  state.reveal={flaws:false,model:false};buildRoom();window.scrollTo(0,0);save();
}
function unlock(t){
  const room=ROOMS[state.room],R=state.rooms[state.room];
  if(R.order[t]!=null)return;
  const rank=R.order.filter(x=>x!=null).length;
  R.order[t]=rank+1;
  const bonus=BONUS[rank]*room.mult*R.cardMult[t];
  addScore(t,bonus);
  state.letters[t][state.room]=true;
  addLog(nm(t)+' opened Door '+room.id+' and earned the letter '+room.letter+' (+'+bonus+').');
  beep(SND.unlock);
  if(state.letters[t].every(Boolean)&&state.escapeBy==null){
    state.escapeBy=t;addScore(t,50);addLog(nm(t)+' opened all five doors first. Escape bonus +50.');
  }
}
function afterChange(){
  const R=state.rooms[state.room];
  if(R.order.every(x=>x!=null)&&(state.rphase==='running'||state.rphase==='paused'))endRound('all');
  else updateAll();
  save();
}
function tryLock(t){
  if(role==='team'){teamTry(t);return;}
  if(state.rphase!=='running')return;
  const room=ROOMS[state.room],R=state.rooms[state.room];
  if(R.order[t]!=null)return;
  if(frozenLeft(t)>0){toast(nm(t)+' is out of office for '+frozenLeft(t)+' more seconds.');return;}
  const text=R.text[t].trim();
  if(text.length<25){toast('Type the rewritten email first.');return;}
  R.attempts[t]++;state.tries[t]++;
  const res=room.pins.map(p=>{try{return !!p.test(text);}catch(e){return false;}});
  R.pins[t]=res.slice();
  const unit=10*room.mult*R.cardMult[t];let gained=0;
  res.forEach((ok,i)=>{if(ok&&!R.earned[t][i]){R.earned[t][i]=true;gained+=unit;}});
  if(gained)addScore(t,gained);
  const lit=res.filter(Boolean).length;
  if(lit===4){unlock(t);}
  else{
    let pen=0;if(R.attempts[t]>2){pen=5;addScore(t,-5);}
    addLog(nm(t)+' tried the lock: '+lit+' of 4 pins'+(gained?' (+'+gained+')':'')+(pen?' (−5 for an extra try)':'')+'.');
    beep(lit?SND.pin:SND.fail);
  }
  afterChange();
}
function judgePin(t,k){
  if(!state.judge||state.rphase==='ready')return;
  const room=ROOMS[state.room],R=state.rooms[state.room];
  if(R.order[t]!=null)return;
  R.pins[t][k]=!R.pins[t][k];
  if(R.pins[t][k]&&!R.earned[t][k]){
    R.earned[t][k]=true;const g=10*room.mult*R.cardMult[t];addScore(t,g);
    addLog('Host lit the '+room.pins[k].short+' pin for '+nm(t)+' (+'+g+').');
  }
  if(R.pins[t].every(Boolean))unlock(t);
  afterChange();
}

let pending=null;
const CARD_INFO={
  ooo:{title:'Out of Office',text:'Pick a rival to freeze. Their Try button is locked for 30 seconds.'},

};
function openPicker(t,card){
  if(state.rphase!=='running')return;
  const R=state.rooms[state.room];
  if(state.cards[t][card]||R.cardPlayed[t])return;
  if(card==='cc'){if(R.order[t]!=null)return;playCard(t,'cc',t);return;}
  pending={t:t,card:card};
  const info=CARD_INFO[card];
  const opts=[0,1,2,3].filter(j=>j!==t).map(j=>{

    return `<button class="btn tm${j+1}" data-act="pick" data-target="${j}"${off?' disabled':''}><span class="dot" style="display:inline-block;vertical-align:-2px;margin-right:6px"></span>${esc(nm(j))}</button>`;
  }).join('');
  $('#picker-body').innerHTML=`<div class="sheet-head"><h2>${esc(info.title)}</h2><button class="btn" data-act="picker-close">Cancel</button></div><p><strong>${esc(nm(t))}</strong> plays this card. ${esc(info.text)}</p><div class="targets">${opts}</div>`;

function playCard(t,card,target){
  const R=state.rooms[state.room];
  if(state.rphase!=='running'||state.cards[t][card]||R.cardPlayed[t])return;
  if(role==='team'){send({a:'card',t:t,card:card,target:target,room:state.room});$('#picker').hidden=true;pending=null;toast('Card sent to the host.');return;}
  state.cards[t][card]=true;R.cardPlayed[t]=true;
  if(card==='ooo'){
    state.frozen[target]=Date.now()+30000;
    addLog(nm(t)+' sent '+nm(target)+' an Out of Office reply. Frozen for 30 seconds.');
  }else if(card==='reply'){
    const amt=Math.min(20,state.teams[target].score);
    state.teams[target].score-=amt;addScore(t,amt);
    addLog(nm(t)+' hit Reply All and took '+amt+' points from '+nm(target)+'.');
  }else{
    R.cardMult[t]=2;addLog(nm(t)+' CC’d the boss. Double points in this door.');
  }
  beep(SND.card);
  $('#picker').hidden=true;pending=null;updateAll();save();
}

function confetti(){
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=$('#confetti');if(!c)return;
  const ctx=c.getContext('2d'),dpr=window.devicePixelRatio||1;
  const W=c.width=Math.round(innerWidth*dpr),H=c.height=Math.round(innerHeight*dpr);
  c.hidden=false;
  const cs=getComputedStyle(document.documentElement);
  const cols=['--t1','--t2','--t3','--t4','--lanyard'].map(k=>cs.getPropertyValue(k).trim()||'#999');
  const P=Array.from({length:150},()=>({x:Math.random()*W,y:-Math.random()*H*.5,w:(6+Math.random()*8)*dpr,h:(10+Math.random()*10)*dpr,vx:(Math.random()-.5)*3*dpr,vy:(2+Math.random()*4)*dpr,a:Math.random()*6.28,va:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();
  (function frame(now){
    ctx.clearRect(0,0,W,H);
    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=p.va;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();});
    if(now-t0<4200)requestAnimationFrame(frame);else{ctx.clearRect(0,0,W,H);c.hidden=true;}
  })(t0);
}

/* ---------- timer tick ---------- */
function tick(){
  if(!state||state.phase!=='room')return;
  if(role==='team'){
    const n2=Date.now();
    if(state.rphase==='running'){const rem=Math.max(0,Math.ceil((state.deadline-n2)/1000));if(rem!==state.remaining){state.remaining=rem;updateTimer();}}
    let ch=false;state.frozen.forEach((f,i)=>{if(f&&n2>=f){state.frozen[i]=0;ch=true;}});
    if(ch&&$('#desk'+myTeam))updateDesks();else updateFrozenText();
    return;
  }
  const now=Date.now();
  if(state.rphase==='running'){
    const rem=Math.max(0,Math.ceil((state.deadline-now)/1000));
    if(rem!==state.remaining){
      state.remaining=rem;updateTimer();scheduleSave();
      if(rem>0&&rem<=5)beep(SND.tick);
    }
    if(rem<=0)endRound('time');
  }
  let changed=false;
  state.frozen.forEach((f,i)=>{if(f&&now>=f){state.frozen[i]=0;changed=true;}});
  if(changed)updateDesks();else updateFrozenText();
}

const HOST_ONLY=new Set(['judge','new','new-now','room-start','room-pause','room-resume','room-add30','room-end','room-next','finish','reveal-flaws','reveal-model','pin','adj','resume','discard']);

    case 'discard':pendingResume=null;try{localStorage.removeItem(KEY);}catch(x){}renderSetup();break;

    case 'new-now':stopSync();try{localStorage.removeItem(KEY);}catch(x){}state=null;renderSetup();window.scrollTo(0,0);break;
    case 'room-start':roomStart();break;

    case 'room-resume':roomResume();break;

const etags={};
let pubTimer=null,pubBusy=false,pubDirty=false,pollT=null,polling=false,cPage=1;
let teamT=null,teamCfg=null,picking=false;
async function gh(cfg,method,path,body,useEtag){
  const headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+cfg.tok,'X-GitHub-Api-Version':'2022-11-28'};
  const url=API+path;
  if(useEtag&&etags[url])headers['If-None-Match']=etags[url];
  if(body)headers['Content-Type']='application/json';
  const res=await fetch(url,{method:method,headers:headers,body:body?JSON.stringify(body):undefined,cache:'no-store'});
  if(res.status===304)return{notModified:true};
  if(!res.ok){let m=String(res.status);try{const j=await res.json();if(j.message)m=res.status+' '+j.message;}catch(e){}throw new Error(m);}
  const et=res.headers.get('ETag');if(useEtag&&et)etags[url]=et;
  return{data:await res.json()};
}
async function createRoom(repo,tok){
  const code=Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.floor(Math.random()*24)]).join('');
  const r=await gh({tok:tok},'POST','/repos/'+repo+'/issues',{title:'Escape the Inbox room '+code,body:JSON.stringify({lobby:true})});
  return{repo:repo,tok:tok,issue:r.data.number,code:code};
}
function stopSync(){clearInterval(pollT);pollT=null;clearInterval(teamT);teamT=null;}

/* host side */
function publicState(){
  const R=state.rooms[state.room];
  return{v:1,now:Date.now(),phase:state.phase,teams:state.teams,secs:state.secs,room:state.room,rphase:state.rphase,remaining:state.remaining,total:state.total,deadline:state.deadline,
    letters:state.letters,cards:state.cards,frozen:state.frozen,escapeBy:state.escapeBy,tries:state.tries,joined:state.joined,reveal:state.reveal,
    log:state.log.slice(0,10),cur:{pins:R.pins,attempts:R.attempts,order:R.order,cardMult:R.cardMult,cardPlayed:R.cardPlayed},
    orders:state.rooms.map(r=>r.order),code:state.live.code};
}
function pubSoon(){clearTimeout(pubTimer);pubTimer=setTimeout(pubNow,500);}
async function pubNow(){
  if(!state||!state.live)return;
  if(pubBusy){pubDirty=true;return;}
  pubBusy=true;
  try{await gh(state.live,'PATCH','/repos/'+state.live.repo+'/issues/'+state.live.issue,{body:JSON.stringify(publicState())});}
  catch(e){toast('Live sync problem: '+e.message);}
  pubBusy=false;if(pubDirty){pubDirty=false;pubSoon();}
}
function startHostSync(){
  stopSync();state.seen=state.seen||[];
  pollT=setInterval(hostPoll,2000);hostPoll();pubSoon();
}
async function hostPoll(){
  if(polling||!state||!state.live)return;
  polling=true;
  try{
    for(let guard=0;guard<5;guard++){
      const r=await gh(state.live,'GET','/repos/'+state.live.repo+'/issues/'+state.live.issue+'/comments?per_page=100&page='+cPage,null,true);
      if(r.notModified)break;
      const items=r.data;
      items.forEach(c=>{
        if(state.seen.indexOf(c.id)>=0)return;
        state.seen.push(c.id);if(state.seen.length>400)state.seen.shift();
        let a=null;try{a=JSON.parse(c.body);}catch(e){}
        if(a&&a.a)applyAction(a);
      });
      if(items.length>=100){cPage++;continue;}
      break;
    }
  }catch(e){}
  polling=false;
}
function applyAction(a){
  if(!state||state.phase!=='room')return;
  const t=a.t;if(!(t>=0&&t<4))return;
  if(a.a==='join'){if(!state.joined[t]){state.joined[t]=true;addLog(nm(t)+' joined.');updateAll();save();}return;}
  if(a.room!==state.room)return;
  const R=state.rooms[state.room];
  if(a.a==='try'){
    R.text[t]=String(a.text||'').slice(0,4000);
    const ta=$('#draft'+t);if(ta)ta.value=R.text[t];
    tryLock(t);
  }else if(a.a==='card'){
    const card=a.card,target=a.target;
    if(card==='cc'){if(R.order[t]!=null)return;playCard(t,'cc',t);}
    else if(card==='ooo'||card==='reply'){
      if(!(target>=0&&target<4)||target===t)return;
      if(card==='ooo'&&R.order[target]!=null)return;
      if(card==='reply'&&state.teams[target].score<=state.teams[t].score)return;
      playCard(t,card,target);
    }
  }
}
function joinURL(){const l=state.live;return location.href.split('#')[0]+'#j='+l.repo+'/'+l.issue+'&k='+l.tok;}
function renderJoinBar(){
  const el=$('#joinbar');if(!el)return;
  const url=joinURL();
  el.innerHTML=`<div class="jb"><div class="jbtext"><h3>Teams join here</h3><p class="muted">Room ${esc(state.live.code)}. Share this link on the projector or in your class group. Delete the token after class.</p><div class="row"><input id="joinurl" class="joininput" readonly value="${esc(url)}" aria-label="Join link"><button class="btn" data-act="copylink">Copy link</button></div><p class="muted" id="joined"></p></div><div id="qr" class="qr"></div></div>`;
  if(window.QRCode){try{new QRCode($('#qr'),{text:url,width:220,height:220,correctLevel:QRCode.CorrectLevel.L});}catch(e){}}
  else{const q=$('#qr');if(q)q.remove();}
}
function renderJoined(){
  const el=$('#joined');if(!el||!state.joined)return;
  el.textContent=state.joined.filter(Boolean).length+' of 4 teams joined';
}
function copyLink(){
  const u=joinURL(),i=$('#joinurl');
  const manual=()=>{if(i){i.focus();i.select();}toast('Press Ctrl+C to copy the link.');};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(u).then(()=>toast('Join link copied.'),manual);
  else manual();
}

/* team side */
function parseJoin(){
  try{
    const h=new URLSearchParams(location.hash.replace(/^#/,''));
    const j=h.get('j'),k=h.get('k');
    const m=j&&k?j.match(/^([\w.-]+\/[\w.-]+)\/(\d+)$/):null;
    if(m)return{repo:m[1],issue:+m[2],tok:k};
  }catch(e){}
  return null;
}
async function teamPoll(){
  if(!teamCfg)return;
  try{
    const r=await gh(teamCfg,'GET','/repos/'+teamCfg.repo+'/issues/'+teamCfg.issue,null,true);
    if(r.notModified)return;
    let p=null;try{p=JSON.parse(r.data.body);}catch(e){}
    if(p&&p.teams)ingest(p);
    else if(!state)$('#main').innerHTML='<p class="lede">Connected. Waiting for the host to start the game.</p>';
  }catch(e){
    if(!state)$('#main').innerHTML='<p class="lede">Could not connect: '+esc(e.message)+'. Ask the host for a fresh link.</p>';
  }
}
function ingest(p){
  const off=Date.now()-p.now,prev=state;
  const s=Object.assign({},p);
  s.rooms=ROOMS.map((r,k)=>{const b=newRoomState();if(p.orders&&p.orders[k])b.order=p.orders[k];if(k===p.room&&p.cur)Object.assign(b,p.cur);return b;});
  s.frozen=(p.frozen||[0,0,0,0]).map(f=>f?f+off:0);
  s.deadline=p.deadline?p.deadline+off:0;
  s.judge=false;s.sound=prev?prev.sound:true;
  if(myTeam>=0)s.rooms[s.room].text[myTeam]=myText[s.room]||'';
  state=s;
  if(myTeam<0){if(!picking){picking=true;renderPick();}return;}
  const lg=p.log&&p.log[0]?p.log[0].m:null;
  if(lg&&lastTop!==null&&lg!==lastTop)toast(lg);
  lastTop=lg||'';
  if(tryBusy&&prev&&prev.rooms&&prev.rooms[prev.room]&&prev.rooms[prev.room].attempts[myTeam]!==s.rooms[s.room].attempts[myTeam])tryBusy=false;
  if(s.phase==='final'){if(!prev||prev.phase!=='final')renderFinal();else renderHeader();return;}
  const same=prev&&prev.phase==='room'&&prev.room===s.room&&$('#desk'+myTeam);
  if(same)updateAll();else buildRoom();
}
function renderPick(){
  renderHeader();
  $('#main').innerHTML=`<section class="hero" style="grid-template-columns:minmax(0,1fr)"><div><div class="eyebrow">Room ${esc(state.code||'')}</div><h1 class="title">Pick your team</h1><p class="lede">Choose once. If your phone reloads, you come back to the same team.</p><div class="targets" style="margin-top:22px">${state.teams.map((t,i)=>`<button class="btn big tm${i+1}" data-act="pick-team" data-team="${i}"><span class="dot" style="display:inline-block;vertical-align:-2px;margin-right:8px"></span>${esc(t.name)}</button>`).join('')}</div></div></section>`;
}
function chooseTeam(t){
  myTeam=t;picking=false;
  try{localStorage.setItem('eti-team-'+teamCfg.repo+'-'+teamCfg.issue,String(t));}catch(e){}
  send({a:'join',t:t});
  if(state.phase==='final')renderFinal();else buildRoom();
}
async function send(obj){
  if(!teamCfg)return;
  try{await gh(teamCfg,'POST','/repos/'+teamCfg.repo+'/issues/'+teamCfg.issue+'/comments',{body:JSON.stringify(obj)});}
  catch(e){tryBusy=false;toast('Could not send: '+e.message);if(state&&myTeam>=0&&$('#desk'+myTeam))updateDesks();}
}
function teamTry(t){
  if(state.rphase!=='running'||tryBusy)return;
  const R=state.rooms[state.room];
  if(R.order[t]!=null)return;
  if(frozenLeft(t)>0){toast('You are out of office for '+frozenLeft(t)+' more seconds.');return;}
  const text=(myText[state.room]||'').trim();
  if(text.length<25){toast('Type the rewritten email first.');return;}
  tryBusy=true;updateDesks();
  send({a:'try',t:t,room:state.room,text:text,id:Date.now()});
  setTimeout(teamPoll,1500);setTimeout(teamPoll,3500);
  setTimeout(()=>{if(tryBusy){tryBusy=false;if(state&&$('#desk'+myTeam))updateDesks();}},12000);
}

/* ---------- boot ---------- */
document.addEventListener('change',e=>{
  if(e.target.id==='live'){const o=$('#liveopts');if(o)o.hidden=!e.target.checked;}
});
$('#rules-body').innerHTML=rulesHTML();
const joinCfg=parseJoin();
if(joinCfg){
  role='team';teamCfg=joinCfg;document.body.classList.add('team');
  try{const v=localStorage.getItem('eti-team-'+joinCfg.repo+'-'+joinCfg.issue);if(v!==null)myTeam=+v;}catch(e){}
  renderHeader();
  $('#main').innerHTML='<p class="lede">Connecting to the room…</p>';
  teamPoll();teamT=setInterval(teamPoll,2500);
}else{
  pendingResume=loadSaved();
  renderSetup();
}
ticker=setInterval(tick,250);
})();
</script>
